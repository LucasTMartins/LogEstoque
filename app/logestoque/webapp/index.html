<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>LogEstoque</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script>
        (function () {
            var token = sessionStorage.getItem('token');
            if (!token) {
                var returnUrl = encodeURIComponent(window.location.href);
                window.location.replace('/login?return=' + returnUrl);
                return;
            }

            // Inject Bearer token into every XHR request
            var _open = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
                var self = this;
                this._url = url;
                // Redirect to login on API 401 (expired token)
                this.addEventListener('load', function () {
                    if (self.status === 401 && self._url && self._url.indexOf('/odata/v4/') !== -1) {
                        sessionStorage.removeItem('token');
                        window.location.replace('/login');
                    }
                });
                return _open.apply(self, arguments);
            };

            var _send = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.send = function (body) {
                var tok = sessionStorage.getItem('token');
                if (tok) {
                    try { this.setRequestHeader('Authorization', 'Bearer ' + tok); } catch (e) {}
                }
                return _send.apply(this, [body]);
            };
        })();
    </script>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.148.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "br.dev.imlucas.logestoque": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
        data-sap-ui-language="pt_BR"
        data-sap-ui-format-locale="pt"
        data-sap-ui-flexibility-services='[{"connector": "LocalStorageConnector"}]'
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="br.dev.imlucas.logestoque"
        data-id="container"
        data-settings='{"id" : "br.dev.imlucas.logestoque"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
