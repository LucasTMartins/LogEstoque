worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting para /auth/login (10 req/min por IP, burst 5 sem fila)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    gzip         on;
    gzip_vary    on;
    gzip_types   text/plain text/css application/json application/javascript text/xml application/xml;

    # ─── Redireciona HTTP para HTTPS ────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name ${NGINX_HOST};
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS ──────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2  on;

        server_name ${NGINX_HOST};

        # Certificados Let's Encrypt (mesmo padrão do QAS)
        ssl_certificate     /etc/letsencrypt/live/${NGINX_HOST}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${NGINX_HOST}/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Headers de segurança
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"                           always;
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-XSS-Protection          "1; mode=block"                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
        # CSP: unsafe-inline/unsafe-eval necessários para SAPUI5
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sapui5.hana.ondemand.com; style-src 'self' 'unsafe-inline' https://sapui5.hana.ondemand.com; img-src 'self' data:; font-src 'self' https://sapui5.hana.ondemand.com; connect-src 'self';"
            always;

        # Login: rate limit por IP (brute-force protection)
        location /auth/login {
            limit_req        zone=login burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://app:4004;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # OData: sem rate limit (chamadas frequentes pela UI Fiori Elements)
        location /odata/ {
            proxy_pass         http://app:4004;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # Aplicação (catch-all com WebSocket support)
        location / {
            proxy_pass         http://app:4004;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
