<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Reset de Dados</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif;
            background: #f5f6f7;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,.10);
            padding: 40px 48px;
            max-width: 460px;
            width: 100%;
        }
        h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; color: #32363a; }
        p  { font-size: .9rem; color: #6a6d70; margin: 0 0 32px; line-height: 1.5; }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: #0070b1;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background .15s;
        }
        button:hover:not(:disabled) { background: #005a91; }
        button:disabled { background: #b0b5ba; cursor: default; }
        #status {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: .9rem;
            display: none;
        }
        #status.ok    { background: #f1fdf6; color: #256f3a; border: 1px solid #b5dfbe; }
        #status.error { background: #fff0f0; color: #bb0000; border: 1px solid #f5bebe; }
        .back { display: block; margin-top: 20px; text-align: center; font-size: .85rem; color: #0070b1; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset de Dados de Demonstração</h1>
    <p>Apaga todos os registros das tabelas e reinsere os dados dos arquivos CSV de fixtures. Use para restaurar o ambiente de demonstração ao estado inicial.</p>
    <button id="btn">Executar Seed</button>
    <div id="status"></div>
    <a class="back" href="/">← Voltar para o sistema</a>
</div>
<script>
    function redirectToLogin() {
        sessionStorage.removeItem('token');
        window.location.replace('/login?return=' + encodeURIComponent('/admin/seed'));
    }

    function showStatus(type, message) {
        const status = document.getElementById('status');
        status.className     = type;
        status.textContent   = message;
        status.style.display = 'block';
    }

    fetch('/auth/me', {
        credentials: 'include',
        headers: { Accept: 'application/json' },
    }).then((res) => {
        if (!res.ok) {
            redirectToLogin();
            return null;
        }
        return res.json();
    }).then((data) => {
        if (!data) return;

        const roles = data.user && Array.isArray(data.user.roles) ? data.user.roles : [];
        if (!roles.includes('ADMIN')) {
            const btn = document.getElementById('btn');
            btn.disabled = true;
            showStatus('error', 'Acesso negado: role ADMIN requerida.');
        }
    }).catch(redirectToLogin);

    document.getElementById('btn').addEventListener('click', async () => {
        if (!confirm('Confirmar reset completo dos dados?\nEsta ação apagará todos os registros atuais e não pode ser desfeita.')) return;

        const btn    = document.getElementById('btn');
        const status = document.getElementById('status');

        btn.disabled    = true;
        btn.textContent = 'Executando...';
        status.style.display = 'none';

        try {
            const res  = await fetch('/admin/seed', {
                method:  'POST',
                credentials: 'include',
            });
            const data = await res.json();

            if (res.status === 401) {
                redirectToLogin();
                return;
            }

            status.className     = res.ok ? 'ok' : 'error';
            status.textContent   = data.message || data.error || 'Falha ao executar seed.';
            status.style.display = 'block';
        } catch (err) {
            status.className     = 'error';
            status.textContent   = 'Falha na requisição: ' + err.message;
            status.style.display = 'block';
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Executar Seed';
        }
    });
</script>
</body>
</html>
