services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - logestoque-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV:    production
      HOST:        0.0.0.0
      PORT:        4004
      JWT_SECRET:  ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - logestoque-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      NGINX_HOST: ${NGINX_HOST}
    # envsubst substitui apenas ${NGINX_HOST}, preservando as variáveis do próprio nginx ($host, $remote_addr, etc.)
    command: >
      /bin/sh -c "envsubst '$$NGINX_HOST'
      < /etc/nginx/nginx.conf.template
      > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      # Certificados gerados pelo certbot no host (mesmo padrão do QAS)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - logestoque-net
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  logestoque-net:
    driver: bridge

volumes:
  postgres-data:
